services:
  lothal.basket.service:
    image: ${DOCKER_REGISTRY-}lothalbasketservice
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=basket-db;Database=BasketDb;Username=postgres;Password=postgres
    ports:
      - "5000:8080"
    depends_on:
      - basket-db

  basket-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    ports:
      - "5432:5432"
    volumes:
      - basket_db_data:/var/lib/postgresql/data

volumes:
  basket_db_data:
