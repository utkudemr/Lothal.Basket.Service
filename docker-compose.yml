services:
  lothal.api.gateway:
    image: ${DOCKER_REGISTRY-}lothalapigateway
    build:
      context: .
      dockerfile: Dockerfile.ApiGateway
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Serilog__WriteTo__1__Args__requestUri=http://victorialogs:9428/insert/jsonline?_stream_fields=service,environment&_msg_field=@m&_time_field=@t
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    ports:
      - "5024:8080"
    depends_on:
      - basket-api
      - product-api
      - stock-api
      - victorialogs


  basket-api:
    image: ${DOCKER_REGISTRY-}lothalbasketapi
    deploy:
      replicas: 2
    restart: always
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=basket-db;Database=BasketDb;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Nats__Url=nats:4222
      - Serilog__WriteTo__1__Args__requestUri=http://victorialogs:9428/insert/jsonline?_stream_fields=service,environment&_msg_field=@m&_time_field=@t
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      basket-db:
        condition: service_healthy
      nats:
        condition: service_started
      victorialogs:
        condition: service_started

  product-api:
    image: ${DOCKER_REGISTRY-}lothalproductapi
    restart: always
    build:
      context: .
      dockerfile: src/Product/Lothal.Product.Api/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ElasticSearch__Url=http://elasticsearch:9200
      - ConnectionStrings__Redis=redis:6379
      - Nats__Url=nats://nats:4222
      - Serilog__WriteTo__1__Args__requestUri=http://victorialogs:9428/insert/jsonline?_stream_fields=service,environment&_msg_field=@m&_time_field=@t
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      elasticsearch:
        condition: service_started
      nats:
        condition: service_started
      stock-api:
        condition: service_started
      victorialogs:
        condition: service_started
 
  stock-api:
    image: ${DOCKER_REGISTRY-}lothalstockapi
    restart: always
    deploy:
      replicas: 2
    build:
      context: .
      dockerfile: Dockerfile.Stock
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__StockDb=Host=basket-db;Database=stockdb;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Nats__Url=nats://nats:4222
      - Serilog__WriteTo__1__Args__requestUri=http://victorialogs:9428/insert/jsonline?_stream_fields=service,environment&_msg_field=@m&_time_field=@t
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      basket-db:
        condition: service_healthy
      redis:
        condition: service_started
      nats:
        condition: service_started
      victorialogs:
        condition: service_started

  lothal.basket.consumer:

    image: ${DOCKER_REGISTRY-}lothalbasketconsumer
    build:
      context: .
      dockerfile: Dockerfile.Consumer
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=basket-db;Database=BasketDb;Username=postgres;Password=postgres
      - ConnectionStrings__Redis=redis:6379
      - Nats__Url=nats:4222
      - Couchbase__ConnectionString=couchbase://couchbase
      - Couchbase__Username=Administrator
      - Couchbase__Password=password
      - Serilog__WriteTo__1__Args__requestUri=http://victorialogs:9428/insert/jsonline?_stream_fields=service,environment&_msg_field=@m&_time_field=@t
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
    depends_on:
      nats:
        condition: service_started
      couchbase:
        condition: service_started
      victorialogs:
        condition: service_started

  basket-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=BasketDb
    ports:
      - "5432:5432"
    volumes:
      - basket_db_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BasketDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

  nats:
    image: nats:latest
    ports:
      - "4222:4222"
      - "8222:8222"

  couchbase:
    image: couchbase:community-7.6.2
    environment:
      - CB_USERNAME=Administrator
      - CB_PASSWORD=password
    ports:
      - "8091-8096:8091-8096"
      - "11210-11211:11210-11211"
    volumes:
      - couchbase_data:/opt/couchbase/var

  victorialogs:
    image: victoriametrics/victoria-logs:latest
    command:
      - -storageDataPath=/victoria-logs-data
      - -httpListenAddr=:9428
    ports:
      - "9428:9428"
    volumes:
      - victoria_logs_data:/victoria-logs-data

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - victorialogs

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

#  load-test:
#    image: grafana/k6:latest
#    profiles: [ "test" ]
#    volumes:
#      - ./tests/k6:/scripts
#    environment:
#      - BASE_URL=http://lothal.api.gateway:8080
#    command: run /scripts/load-test.js

volumes:
  basket_db_data:
  couchbase_data:
  victoria_logs_data:
  grafana_data:
  elasticsearch_data:
